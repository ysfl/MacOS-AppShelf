name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # swift-testing needs a Swift 6 toolchain. Prefer an installed Xcode 16+ on the
      # runner image and fall back to whatever the image defaults to, so the workflow
      # does not rot when GitHub bumps the image's Xcode.
      # Hooks are bypassable locally, so the same sweep runs here. `publication` is the
      # one that must never be skippable: a leak in a public repo cannot be recalled.
      - name: Project gates
        run: python3 Scripts/gates/gates.py all --quiet

      # AppKit signatures differ between SDKs: the same source is clean on Swift 6.2/6.3
      # but failed on 6.0. Pick the newest Xcode the image offers and assert a floor, so a
      # stale image fails with a readable message instead of confusing compiler noise.
      - name: Select the pinned toolchain
        env:
          PIN_SWIFT: "6.2"
        run: |
          set -euo pipefail
          candidate="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -t_ -k2 -V | tail -1 || true)"
          if [ -n "$candidate" ]; then
            sudo xcode-select -s "$candidate/Contents/Developer"
          fi
          swift --version
          detected="$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+\.[0-9]+).*/\1/p')"
          echo "detected Swift $detected, requiring >= $PIN_SWIFT"
          printf '%s\n%s\n' "$PIN_SWIFT" "$detected" | sort -C -V || {
            echo "Toolchain too old: need Swift $PIN_SWIFT, found $detected" >&2
            exit 1
          }
          echo "toolchain ok"

      # The project's own contribution gate is a warning-free build, so CI enforces it
      # rather than relying on whoever remembers the flag.
      - name: Build (warnings as errors)
        run: swift build -c debug -Xswiftc -warnings-as-errors

      - name: Test AppShelfCore
        run: swift test

      # Assembles the real .app: icon generation, Info.plist version write-back, ad-hoc
      # signing. Catches bundle-level breakage a plain `swift build` cannot see.
      - name: Build app bundle
        run: ./Scripts/build-app.sh release

      - name: Assert the bundle reports a version
        run: |
          set -euo pipefail
          version=$(plutil -extract CFBundleShortVersionString raw dist/AppShelf.app/Contents/Info.plist)
          echo "bundle version: $version"
          test "$version" != "1.1.0" || {
            echo "The bundle still carries the placeholder version." >&2; exit 1; }
          test -n "$version"

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: AppShelf-debug
          path: dist/AppShelf.app
          retention-days: 7
