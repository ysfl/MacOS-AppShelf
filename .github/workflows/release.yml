name: Release

# Tag-driven only: pushing code must never publish anything to a public repo.
on:
  push:
    tags: ["v*"]

permissions:
  # The default workflow token is read-only on this repo, so publishing fails with
  # HTTP 403 unless contents:write is granted explicitly.
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # swift-testing needs a Swift 6 toolchain. Prefer an installed Xcode 16+ on the
      # runner image and fall back to whatever the image defaults to, so the workflow
      # does not rot when GitHub bumps the image's Xcode.
      - name: Select a Swift 6 toolchain
        run: |
          set -euo pipefail
          candidate="$(ls -d /Applications/Xcode_1[6-9]*.app 2>/dev/null | sort | tail -1 || true)"
          if [ -n "$candidate" ]; then
            sudo xcode-select -s "$candidate/Contents/Developer"
          fi
          swift --version
          swift --version | grep -q "Swift version 6\." || {
            echo "A Swift 6 toolchain is required." >&2
            exit 1
          }

      - name: Test before packaging
        run: swift test

      # VERSION is the tag, and build-release.sh refuses if CHANGELOG.md documents a
      # different latest version. That guard exists because a 1.2.0 DMG once shipped a
      # bundle whose Info.plist still said 1.1.0.
      - name: Build the DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./Scripts/build-release.sh "$version"
          echo "DMG=release/AppShelf-$version.dmg" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify the package
        run: |
          set -euo pipefail
          (cd release && shasum -a 256 -c SHA256SUMS)
          hdiutil verify "$DMG"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$DMG" release/SHA256SUMS --clobber
          else
            gh release create "v$VERSION" "$DMG" release/SHA256SUMS \
              --title "AppShelf $VERSION" \
              --notes-file <(awk '/^## /{n++} n==1{print} n>1{exit}' CHANGELOG.md)
          fi
