name: Release

# Tag-driven only: pushing code must never publish anything to a public repo.
on:
  push:
    tags: ["v*"]

permissions:
  # The default workflow token is read-only on this repo, so publishing fails with
  # HTTP 403 unless contents:write is granted explicitly.
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # AppKit signatures differ between SDKs, so a build that is clean on one Swift 6
      # compiler can fail on another. Pin to the toolchain this project is developed and
      # reviewed against, and fail loudly rather than confusingly when it is absent.
      - name: Select the pinned toolchain
        run: |
          set -euo pipefail
          echo "available Xcode:"; ls -d /Applications/Xcode_*.app 2>/dev/null | sed 's/^/  /' || true
          candidate="$(ls -d /Applications/Xcode_[0-9]*.app 2>/dev/null \
            | sort -t_ -k2 -V | tail -1 || true)"
          if [ -n "$candidate" ]; then
            sudo xcode-select -s "$candidate/Contents/Developer"
          fi
          swift --version
          major_minor="$(swift --version 2>&1 | sed -nE 's/.*Swift version ([0-9]+)\.([0-9]+).*/\1.\2/p')"
          echo "detected Swift $major_minor; requiring >= $PIN_SWIFT"
          printf '%s\n' "$PIN_SWIFT" "$major_minor" | sort -V -C && echo "toolchain ok" || {
            echo "Toolchain too old: need Swift $PIN_SWIFT, found $major_minor" >&2
            exit 1
          }
        env:
          PIN_SWIFT: 6.2

      - name: Test before packaging
        run: swift test

      # A release is the point of no return for a public repo, so the content red lines
      # are re-checked against the exact commit being shipped.
      - name: Publication and quality gates
        run: python3 Scripts/gates/gates.py all --quiet

      # VERSION is the tag, and build-release.sh refuses if CHANGELOG.md documents a
      # different latest version. That guard exists because a 1.2.0 DMG once shipped a
      # bundle whose Info.plist still said 1.1.0.
      - name: Build the DMG
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ./Scripts/build-release.sh "$version"
          echo "DMG=release/AppShelf-$version.dmg" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify the package
        run: |
          set -euo pipefail
          (cd release && shasum -a 256 -c SHA256SUMS)
          hdiutil verify "$DMG"

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$DMG" release/SHA256SUMS --clobber
          else
            gh release create "v$VERSION" "$DMG" release/SHA256SUMS \
              --title "AppShelf $VERSION" \
              --notes-file <(awk '/^## /{n++} n==1{print} n>1{exit}' CHANGELOG.md)
          fi
